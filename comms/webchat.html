<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENGO — SY Gelliceaux</title>
<style>
  :root {
    --bg0: #06090d; --bg1: #0a0f15; --glass: rgba(16, 24, 32, .72);
    --glass2: rgba(22, 32, 42, .82); --line: rgba(120, 160, 190, .14);
    --text: #e6edf2; --dim: #7d8f9c; --dim2: #55656f;
    --accent: #46d7e8; --accent2: #2f9fd4;
    --me1: #123a4e; --me2: #0d2c3d; --err: #ff7a7a;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, sans-serif;
    background:
      radial-gradient(1100px 500px at 75% -10%, rgba(46, 140, 190, .16), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(20, 90, 130, .12), transparent 55%),
      linear-gradient(180deg, var(--bg1), var(--bg0));
    background-attachment: fixed;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  /* faint horizon line texture */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .05;
    background-image: repeating-linear-gradient(180deg, transparent 0 46px, #9fd8e8 46px 47px);
  }

  /* ── header ─────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; z-index: 5;
    background: var(--glass); backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    width: 38px; height: 38px; flex: none; display: grid; place-items: center;
    background: linear-gradient(135deg, #0f3446, #0a2230);
    border: 1px solid rgba(70, 215, 232, .35); border-radius: 10px;
    color: var(--accent); font-weight: 800; font-size: 17px; letter-spacing: .5px;
    box-shadow: 0 0 18px rgba(70, 215, 232, .18), inset 0 0 12px rgba(70, 215, 232, .08);
  }
  .title { display: flex; flex-direction: column; min-width: 0; }
  .title .word { font-weight: 800; letter-spacing: .34em; font-size: 15px; }
  .title .word span { color: var(--accent); }
  .title .vessel { font-size: 11px; color: var(--dim); letter-spacing: .18em; text-transform: uppercase; }
  .spacer { flex: 1; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim);
            padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(10,16,22,.4); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #35e08f;
         box-shadow: 0 0 8px #35e08f; animation: pulse 2.4s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .hbtn {
    background: var(--glass2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 600;
    transition: border-color .15s, transform .1s;
  }
  .hbtn:hover { border-color: var(--accent); }
  .hbtn:active { transform: scale(.97); }
  .hbtn.primary { background: linear-gradient(135deg, rgba(70,215,232,.18), rgba(47,159,212,.12));
                  border-color: rgba(70,215,232,.4); color: var(--accent); }

  /* ── conversation drawer ────────────────────────── */
  #drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 320px; max-width: 85vw; z-index: 20;
    background: rgba(9, 14, 20, .96); backdrop-filter: blur(24px);
    border-right: 1px solid var(--line); padding: 16px;
    transform: translateX(-105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; gap: 10px;
  }
  #drawer.open { transform: none; }
  #drawer h2 { margin: 4px 2px 8px; font-size: 12px; letter-spacing: .2em; color: var(--dim);
               text-transform: uppercase; font-weight: 700; }
  #convlist { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .convitem {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
    background: rgba(18, 27, 36, .5); cursor: pointer; transition: border-color .15s;
  }
  .convitem:hover { border-color: rgba(70,215,232,.45); }
  .convitem.active { border-color: var(--accent); background: rgba(20, 45, 58, .55); }
  .convitem .t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convitem .d { font-size: 11px; color: var(--dim2); margin-top: 2px; }
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 15;
           opacity: 0; pointer-events: none; transition: opacity .25s; }
  #scrim.open { opacity: 1; pointer-events: auto; }

  /* ── chat log ───────────────────────────────────── */
  #log { flex: 1; overflow-y: auto; padding: 26px 20px 10px; scroll-behavior: smooth; }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: rgba(110,140,160,.25); border-radius: 4px; }
  .row { max-width: 860px; margin: 0 auto 18px; display: flex; gap: 12px;
         animation: rise .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .row.me { justify-content: flex-end; }
  .avatar {
    width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center;
    font-size: 13px; font-weight: 800; margin-top: 2px;
    background: linear-gradient(135deg, #0f3446, #0a2230);
    border: 1px solid rgba(70,215,232,.3); color: var(--accent);
  }
  .bubble {
    padding: 12px 16px; border-radius: var(--radius); max-width: 78%;
    word-wrap: break-word; overflow-wrap: break-word;
  }
  .me .bubble {
    background: linear-gradient(135deg, var(--me1), var(--me2));
    border: 1px solid rgba(70, 160, 200, .25); border-bottom-right-radius: 6px;
    white-space: pre-wrap;
  }
  .engo .bubble {
    background: var(--glass); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-bottom-left-radius: 6px; max-width: 84%;
  }
  .engo .bubble.error { border-color: rgba(255,122,122,.4); color: var(--err); }

  /* markdown inside answers */
  .md p { margin: 0 0 10px; } .md p:last-child { margin-bottom: 0; }
  .md h1,.md h2,.md h3 { margin: 14px 0 6px; font-size: 15px; color: #fff; }
  .md h1:first-child,.md h2:first-child,.md h3:first-child { margin-top: 0; }
  .md ul,.md ol { margin: 4px 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md code { background: rgba(70,215,232,.1); border: 1px solid rgba(70,215,232,.18);
             padding: 1px 6px; border-radius: 6px; font-size: 13px;
             font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .md pre { background: rgba(5,10,14,.7); border: 1px solid var(--line); border-radius: 10px;
            padding: 10px 12px; overflow-x: auto; }
  .md pre code { background: none; border: none; padding: 0; }
  .md strong { color: #fff; }
  .md .cite { color: var(--accent); font-size: 0.92em; }

  /* sources + meta */
  .extras { max-width: 860px; margin: -10px auto 20px; padding-left: 44px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px; color: var(--dim); background: rgba(16,26,34,.6);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px;
    display: inline-flex; align-items: center; gap: 6px; max-width: 340px;
  }
  .chip svg { flex: none; opacity: .7; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 11px; color: var(--dim2); margin-top: 6px; }

  /* thinking indicator */
  .think { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 14px; }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
            animation: bob 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%,60%,100% { transform: none; opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }

  /* welcome card */
  .welcome {
    max-width: 620px; margin: 8vh auto 0; text-align: center; padding: 34px 30px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 22px;
    backdrop-filter: blur(14px); animation: rise .45s cubic-bezier(.2,.8,.2,1);
  }
  .welcome .mark { font-size: 26px; font-weight: 800; letter-spacing: .4em; margin-bottom: 4px; }
  .welcome .mark span { color: var(--accent); }
  .welcome .sub { color: var(--dim); font-size: 13px; letter-spacing: .16em;
                  text-transform: uppercase; margin-bottom: 18px; }
  .welcome p { color: var(--dim); font-size: 14px; margin: 0 0 18px; }
  .sugs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sug { font-size: 12.5px; color: var(--text); background: rgba(20,32,42,.6);
         border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer;
         transition: border-color .15s; }
  .sug:hover { border-color: var(--accent); color: var(--accent); }

  /* ── input bar ──────────────────────────────────── */
  footer { padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); z-index: 5; }
  .inputwrap {
    max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--glass2); backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 8px 18px;
    transition: border-color .2s, box-shadow .2s;
  }
  .inputwrap:focus-within { border-color: rgba(70,215,232,.5);
                            box-shadow: 0 0 0 3px rgba(70,215,232,.08), 0 8px 30px rgba(0,0,0,.35); }
  textarea {
    flex: 1; resize: none; background: none; color: var(--text); border: 0;
    font: inherit; max-height: 140px; min-height: 24px; padding: 6px 0; outline: none;
  }
  textarea::placeholder { color: var(--dim2); }
  #send {
    width: 42px; height: 42px; flex: none; border: 0; border-radius: 13px; cursor: pointer;
    display: grid; place-items: center; color: #04222c;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 4px 16px rgba(70,215,232,.3); transition: transform .12s, opacity .2s;
  }
  #send:hover { transform: translateY(-1px); }
  #send:disabled { opacity: .35; cursor: default; transform: none; }
  .hint { max-width: 860px; margin: 8px auto 0; text-align: center; font-size: 11px; color: var(--dim2); }

  @media (max-width: 640px) {
    .bubble { max-width: 88%; } .engo .bubble { max-width: 88%; }
    .title .vessel { display: none; } .status { display: none; }
    .extras { padding-left: 12px; }
  }
</style>
</head>
<body>

<header>
  <button class="hbtn" id="menu" title="Conversations" aria-label="Conversations">☰</button>
  <div class="logo">E</div>
  <div class="title">
    <div class="word">ENG<span>O</span></div>
    <div class="vessel">SY Gelliceaux · SW108 Hybrid</div>
  </div>
  <div class="spacer"></div>
  <div class="status"><span class="dot"></span><span id="statustext">Engineering assistant online</span></div>
  <button class="hbtn primary" id="newconv">+ New</button>
</header>

<div id="scrim"></div>
<aside id="drawer">
  <h2>Conversations</h2>
  <div id="convlist"></div>
</aside>

<div id="log"></div>

<footer>
  <div class="inputwrap">
    <textarea id="q" rows="1" placeholder="Ask about any system aboard…"></textarea>
    <button id="send" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/>
      </svg>
    </button>
  </div>
  <div class="hint">Engo answers from the vessel's documentation and cites its sources. Verify safety-critical values against the OEM manual.</div>
</footer>

<script>
const log = document.getElementById('log');
const q = document.getElementById('q');
const send = document.getElementById('send');
const drawer = document.getElementById('drawer');
const scrim = document.getElementById('scrim');
const convlist = document.getElementById('convlist');

/* ── conversation id ── */
function newCid() {
  const d = new Date().toISOString().slice(0,10).replaceAll('-','');
  return 'chat-' + d + '-' + Math.random().toString(36).slice(2,7);
}
let cid = localStorage.getItem('engo_cid') || newCid();
localStorage.setItem('engo_cid', cid);

/* ── minimal safe markdown ── */
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function md(src) {
  let s = esc(src);
  // fenced code
  s = s.replace(/```([\s\S]*?)```/g, (_, c) => '<pre><code>' + c.trim() + '</code></pre>');
  const lines = s.split('\n');
  let html = '', inUl = false, inOl = false, para = [];
  const flushP = () => { if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  const closeL = () => { if (inUl) { html += '</ul>'; inUl = false; } if (inOl) { html += '</ol>'; inOl = false; } };
  for (const raw of lines) {
    const line = raw;
    if (/^\s*$/.test(line)) { flushP(); closeL(); continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flushP(); closeL();
      html += `<h${m[1].length+0}>` + inline(m[2]) + `</h${m[1].length+0}>`; continue; }
    if ((m = line.match(/^\s*[-•*]\s+(.*)/))) { flushP(); if (inOl) closeL();
      if (!inUl) { html += '<ul>'; inUl = true; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if ((m = line.match(/^\s*(\d+)[.)]\s+(.*)/))) { flushP(); if (inUl) closeL();
      if (!inOl) { html += '<ol>'; inOl = true; } html += '<li>' + inline(m[2]) + '</li>'; continue; }
    if (line.startsWith('<pre>')) { flushP(); closeL(); html += line; continue; }
    closeL(); para.push(inline(line));
  }
  flushP(); closeL();
  return html;
}
function inline(s) {
  return s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]{2,90}?, (?:p\.|sheet|section)[^\]]*)\]/g, '<span class="cite">[$1]</span>');
}

/* ── rendering ── */
function rowMe(text) {
  const r = document.createElement('div'); r.className = 'row me';
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
  r.appendChild(b); log.appendChild(r); scrollDown(); return r;
}
function rowEngo(text, isErr) {
  const r = document.createElement('div'); r.className = 'row engo';
  r.innerHTML = '<div class="avatar">E</div>';
  const b = document.createElement('div');
  b.className = 'bubble' + (isErr ? ' error' : '');
  if (isErr) { b.textContent = text; }
  else { const m = document.createElement('div'); m.className = 'md'; m.innerHTML = md(text); b.appendChild(m); }
  r.appendChild(b); log.appendChild(r); scrollDown(); return r;
}
function rowThinking() {
  const r = document.createElement('div'); r.className = 'row engo';
  r.innerHTML = `<div class="avatar">E</div>
    <div class="bubble"><div class="think">
      <span class="dots"><i></i><i></i><i></i></span>
      <span id="thinktext">Searching the vessel's documentation…</span>
    </div></div>`;
  log.appendChild(r); scrollDown();
  const phases = ['Searching the vessel’s documentation…', 'Reading the relevant sections…',
                  'Cross-checking sources…', 'Writing the answer…'];
  let i = 0;
  const tick = setInterval(() => {
    const el = r.querySelector('#thinktext');
    if (!el) { clearInterval(tick); return; }
    i = Math.min(i + 1, phases.length - 1); el.textContent = phases[i];
  }, 6000);
  r._tick = tick; return r;
}
function extras(d) {
  const wrap = document.createElement('div'); wrap.className = 'extras';
  const chunks = d.chunks_used || [];
  if (chunks.length) {
    const c = document.createElement('div'); c.className = 'chips';
    const seen = new Set();
    for (const ch of chunks) {
      const label = ch.file + (ch.location && ch.location !== '-' ? ' · ' + ch.location : '');
      if (seen.has(label)) continue; seen.add(label);
      const chip = document.createElement('div'); chip.className = 'chip'; chip.title = label;
      chip.innerHTML = `<svg width="11" height="13" viewBox="0 0 12 14" fill="none"
          stroke="currentColor" stroke-width="1.3"><path d="M2 1h5l3 3v9H2z"/><path d="M7 1v3h3"/></svg>
        <span></span>`;
      chip.querySelector('span').textContent = label;
      c.appendChild(chip);
    }
    wrap.appendChild(c);
  }
  if (d.duration_ms) {
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = (d.duration_ms/1000).toFixed(1) + 's';
    wrap.appendChild(m);
  }
  log.appendChild(wrap); scrollDown();
}
function scrollDown() { log.scrollTop = log.scrollHeight; }

/* ── welcome ── */
function welcome() {
  const w = document.createElement('div'); w.className = 'welcome';
  w.innerHTML = `
    <div class="mark">ENG<span>O</span></div>
    <div class="sub">Vessel engineering assistant</div>
    <p>Ask about any system aboard — propulsion, hydraulics, electrical, plumbing,
       spares, procedures. Every answer cites the document it came from.</p>
    <div class="sugs">
      <div class="sug">What caused the BEL crashes?</div>
      <div class="sug">Bypass fresh water to dock supply</div>
      <div class="sug">OMS bow thruster spares onboard</div>
      <div class="sug">GPM-12 maintenance due</div>
    </div>`;
  w.querySelectorAll('.sug').forEach(el =>
    el.onclick = () => { q.value = el.textContent; ask(); });
  log.appendChild(w);
}

/* ── data flow ── */
async function loadHistory() {
  log.innerHTML = '';
  try {
    const r = await fetch('/api/history?cid=' + encodeURIComponent(cid));
    const d = await r.json();
    const turns = d.turns || [];
    if (!turns.length) { welcome(); return; }
    turns.forEach(t => { rowMe(t.question); rowEngo(t.answer); });
  } catch (e) { welcome(); }
}
async function loadConvs() {
  try {
    const r = await fetch('/api/conversations');
    const d = await r.json();
    convlist.innerHTML = '';
    (d.conversations || []).forEach(c => {
      const el = document.createElement('div');
      el.className = 'convitem' + (c.id === cid ? ' active' : '');
      el.innerHTML = '<div class="t"></div><div class="d"></div>';
      el.querySelector('.t').textContent = c.title;
      el.querySelector('.d').textContent =
        (c.updated_at || '').slice(0, 16).replace('T', ' · ') + '  ·  ' + c.n_turns + ' turns';
      el.onclick = () => {
        cid = c.id; localStorage.setItem('engo_cid', cid);
        closeDrawer(); loadHistory();
      };
      convlist.appendChild(el);
    });
    if (!convlist.children.length)
      convlist.innerHTML = '<div class="meta" style="padding:8px">No saved conversations yet.</div>';
  } catch (e) { /* ignore */ }
}

async function ask() {
  const text = q.value.trim();
  if (!text || send.disabled) return;
  document.querySelector('.welcome')?.remove();
  q.value = ''; autosize();
  rowMe(text);
  const wait = rowThinking();
  send.disabled = true;
  try {
    const r = await fetch('/api/query', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: text, conversation_id: cid})
    });
    const d = await r.json();
    clearInterval(wait._tick); wait.remove();
    if (d.error) rowEngo('Error: ' + d.error, true);
    else { rowEngo(d.answer); extras(d); }
  } catch (e) {
    clearInterval(wait._tick); wait.remove();
    rowEngo('Network error: ' + e, true);
  } finally {
    send.disabled = false; q.focus();
  }
}

/* ── ui wiring ── */
function autosize() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; }
q.addEventListener('input', autosize);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
send.onclick = ask;
document.getElementById('newconv').onclick = () => {
  cid = newCid(); localStorage.setItem('engo_cid', cid);
  loadHistory(); q.focus();
};
function openDrawer() { drawer.classList.add('open'); scrim.classList.add('open'); loadConvs(); }
function closeDrawer() { drawer.classList.remove('open'); scrim.classList.remove('open'); }
document.getElementById('menu').onclick = () =>
  drawer.classList.contains('open') ? closeDrawer() : openDrawer();
scrim.onclick = closeDrawer;

loadHistory();
q.focus();
</script>
</body>
</html>
