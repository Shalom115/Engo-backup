<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engo — SY Gelliceaux</title>
<style>
  :root {
    --bg: #0f1418; --panel: #171e24; --panel2: #1e272f;
    --text: #dce3e8; --dim: #8a97a0; --accent: #3fa7d6; --me: #24485e;
    --err: #d66; --line: #2a343d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; flex: 1; }
  header button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
                  border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  header button:hover { border-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 780px; margin: 0 auto 14px; padding: 10px 14px; border-radius: 10px;
         white-space: pre-wrap; word-wrap: break-word; }
  .me  { background: var(--me); margin-left: 120px; }
  .engo { background: var(--panel); border: 1px solid var(--line); margin-right: 40px; }
  .engo b { color: #fff; }
  .sources { max-width: 780px; margin: -8px auto 16px; margin-right: 40px;
             font-size: 12px; color: var(--dim); padding: 0 14px; }
  .meta { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .error { background: #2a1518; border: 1px solid #5a2a2e; color: var(--err); }
  .thinking { color: var(--dim); font-style: italic; }
  footer { padding: 12px 16px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  .inputrow { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; background: var(--panel2); color: var(--text);
             border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
             font: inherit; height: 52px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  #send { background: var(--accent); color: #06202e; border: 0; border-radius: 8px;
          padding: 0 22px; font-weight: 700; cursor: pointer; font-size: 15px; }
  #send:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Engo</h1>
  <div class="sub" id="cid"></div>
  <button id="newconv">New conversation</button>
</header>
<div id="log"></div>
<footer>
  <div class="inputrow">
    <textarea id="q" placeholder="Ask about the boat… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
  </div>
</footer>
<script>
const log = document.getElementById('log');
const q = document.getElementById('q');
const send = document.getElementById('send');
const cidLabel = document.getElementById('cid');

function newCid() {
  const d = new Date().toISOString().slice(0,10).replaceAll('-','');
  return 'chat-' + d + '-' + Math.random().toString(36).slice(2,7);
}
let cid = localStorage.getItem('engo_cid') || newCid();
localStorage.setItem('engo_cid', cid);
cidLabel.textContent = cid;

function bubble(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function sources(chunks) {
  if (!chunks || !chunks.length) return;
  const el = document.createElement('div');
  el.className = 'sources';
  el.textContent = 'Sources: ' + chunks.map(c =>
    c.file + (c.location && c.location !== '-' ? ' (' + c.location + ')' : '')
  ).filter((v,i,a) => a.indexOf(v) === i).join(' · ');
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

async function loadHistory() {
  try {
    const r = await fetch('/api/history?cid=' + encodeURIComponent(cid));
    const d = await r.json();
    (d.turns || []).forEach(t => { bubble('me', t.question); bubble('engo', t.answer); });
  } catch (e) { /* fresh conversation */ }
}

async function ask() {
  const text = q.value.trim();
  if (!text || send.disabled) return;
  q.value = '';
  bubble('me', text);
  const wait = bubble('engo thinking', 'Engo is reading the documentation…');
  send.disabled = true;
  try {
    const r = await fetch('/api/query', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: text, conversation_id: cid})
    });
    const d = await r.json();
    wait.remove();
    if (d.error) {
      bubble('engo error', 'Error: ' + d.error);
    } else {
      bubble('engo', d.answer);
      sources(d.chunks_used);
    }
  } catch (e) {
    wait.remove();
    bubble('engo error', 'Network error: ' + e);
  } finally {
    send.disabled = false;
    q.focus();
  }
}

send.onclick = ask;
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
document.getElementById('newconv').onclick = () => {
  cid = newCid();
  localStorage.setItem('engo_cid', cid);
  cidLabel.textContent = cid;
  log.innerHTML = '';
  q.focus();
};

loadHistory();
q.focus();
</script>
</body>
</html>
